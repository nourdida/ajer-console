plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ajer.console'
    compileSdk 33

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.ajer.console'
        minSdk 24
        targetSdk 33
        versionCode 3
        versionName '1.1'
    }
}
